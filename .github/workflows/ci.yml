name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Lab master with EtherCrab (feature `master`)
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p flowlab-cli --features master -- -D warnings
          cargo test -p flowlab-master --features hardware
      - name: Generated UI types are up to date
        run: git diff --exit-code -- ui/src/api/gen
      - name: Synthetic capture round trip
        run: |
          cargo run -q -p flowlab-cli -- synth configs/synth/demo.json -o results/demo.pcapng --truth results/truth.json
          cargo run -q -p flowlab-cli -- analyze results/demo.pcapng --out results/report.json
      - name: ENI, ESI and planner round trip
        run: |
          cargo run -q -p flowlab-cli -- synth configs/synth/demo.json -o results/demo.pcapng --eni results/demo.eni.xml
          cargo run -q -p flowlab-cli -- analyze results/demo.pcapng --eni results/demo.eni.xml --out results/eni-report.json
          cargo run -q -p flowlab-cli -- esi crates/flowlab-devices/tests/fixtures/flowlab-demo.esi.xml
          cargo run -q -p flowlab-cli -- plan
      - name: Simulator runs the shipped scenarios
        run: |
          cargo run -q --release -p flowlab-cli -- simulate configs/sim/example.json configs/studies/bulk-transfer/{smoke,large-payload,mixed-load}.json
          cargo run -q --release -p flowlab-cli -- study configs/studies/bulk-transfer/foe-sweep.json

  musl:
    # Static binaries for Linux PCs and the Verdin (aarch64), as the release workflow builds
    # them; the UI is a stand-in here.
    name: Static Linux build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Stand-in UI to embed
        run: mkdir -p ui/dist && echo '<!doctype html><title>FlowLab stand-in</title>' > ui/dist/index.html
      # With the lab master (EtherCrab, raw socket), as the release builds it for Linux.
      - run: cargo zigbuild --locked --release -p flowlab-cli --features embed-ui,master --target ${{ matrix.target }}
      - name: The binary is static
        run: file target/${{ matrix.target }}/release/flowlab | tee /dev/stderr | grep -q 'statically linked'
      - name: The binary serves its embedded UI from any directory
        if: matrix.target == 'x86_64-unknown-linux-musl'
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/flowlab" serve --port 7979 &
          server=$!
          for _ in $(seq 50); do curl -sf http://127.0.0.1:7979/api/health && break; sleep 0.2; done
          curl -sf http://127.0.0.1:7979/simulate | grep -q 'FlowLab stand-in'
          kill $server

  wireshark:
    name: Cross-check with Wireshark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tshark
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq tshark
          tshark --version | head -1
      - name: Mailbox decoding matches the EtherCAT dissector
        run: |
          mkdir -p results
          cargo run -q -p flowlab-cli -- synth configs/synth/demo.json -o results/demo.pcapng
          cargo run -q -p flowlab-cli -- analyze results/demo.pcapng --out results/demo.json
          python3 scripts/crosscheck-tshark.py results/demo.pcapng results/demo.json
      - name: Simulated frames match the EtherCAT dissector
        run: |
          cargo run -q -p flowlab-cli -- simulate configs/sim/example.json -o results/sim.pcapng
          cargo run -q -p flowlab-cli -- analyze results/sim.pcapng --out results/sim.json
          python3 scripts/crosscheck-tshark.py results/sim.pcapng results/sim.json

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:run
      - run: bun run build

  docs:
    name: Docs and book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4
      - name: Site builds (book, rustdoc without warnings, start and findings pages)
        run: scripts/build-site.sh
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Links in the book sources, README and site pages resolve
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress --exclude-path book/build --exclude-path _site/api --exclude-path _site/book
            --exclude 'api/' 'book/src/**/*.md' README.md _site/index.html _site/api/index.html _site/findings/index.html
          fail: true

  report:
    name: Study report is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p flowlab-cli
      - run: python3 scripts/bulk-transfer-report.py
      - name: Committed specs and tables match the code
        run: git diff --exit-code -- configs/studies/bulk-transfer/report book/src/studies/bulk-transfer/generated

  licenses:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
