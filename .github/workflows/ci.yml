name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Generated UI types are up to date
        run: git diff --exit-code -- ui/src/api/gen
      - name: Synthetic capture round trip
        run: |
          cargo run -q -p flowlab-cli -- synth configs/synth/demo.json -o results/demo.pcapng --truth results/truth.json
          cargo run -q -p flowlab-cli -- analyze results/demo.pcapng --out results/report.json
      - name: ENI, ESI and planner round trip
        run: |
          cargo run -q -p flowlab-cli -- synth configs/synth/demo.json -o results/demo.pcapng --eni results/demo.eni.xml
          cargo run -q -p flowlab-cli -- analyze results/demo.pcapng --eni results/demo.eni.xml --out results/eni-report.json
          cargo run -q -p flowlab-cli -- esi crates/flowlab-devices/tests/fixtures/flowlab-demo.esi.xml
          cargo run -q -p flowlab-cli -- plan
      - name: Simulator runs the shipped scenarios
        run: |
          cargo run -q --release -p flowlab-cli -- simulate configs/sim/example.json configs/studies/bulk-transfer/{smoke,large-payload,mixed-load}.json
          cargo run -q --release -p flowlab-cli -- study configs/studies/bulk-transfer/foe-sweep.json

  wireshark:
    name: Cross-check with Wireshark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tshark
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq tshark
          tshark --version | head -1
      - name: Mailbox decoding matches the EtherCAT dissector
        run: |
          mkdir -p results
          cargo run -q -p flowlab-cli -- synth configs/synth/demo.json -o results/demo.pcapng
          cargo run -q -p flowlab-cli -- analyze results/demo.pcapng --out results/demo.json
          python3 scripts/crosscheck-tshark.py results/demo.pcapng results/demo.json
      - name: Simulated frames match the EtherCAT dissector
        run: |
          cargo run -q -p flowlab-cli -- simulate configs/sim/example.json -o results/sim.pcapng
          cargo run -q -p flowlab-cli -- analyze results/sim.pcapng --out results/sim.json
          python3 scripts/crosscheck-tshark.py results/sim.pcapng results/sim.json

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:run
      - run: bun run build

  docs:
    name: Docs and book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4
      - name: Rust API docs build without warnings
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Book builds
        run: mdbook build book
      - name: Links inside the book and README resolve
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path book/build --exclude 'api/' 'book/src/**/*.md' README.md
          fail: true

  report:
    name: Study report is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p flowlab-cli
      - run: python3 scripts/bulk-transfer-report.py
      - name: Committed specs and tables match the code
        run: git diff --exit-code -- configs/studies/bulk-transfer/report book/src/studies/bulk-transfer/generated

  licenses:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
