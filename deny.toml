# cargo-deny: licences, advisories, sources. `cargo deny check`.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
]
# ISC (permissive, MIT-like) for one crate only: libloading, a build dependency of `pcap`,
# which EtherCrab uses on Windows (flowlab-master's `hardware` feature).
# 0BSD (public-domain-like, no conditions) for smoltcp, the TCP/IP stack of the lab master's EoE
# gateway (flowlab-master), and its buffer crate `managed`.
exceptions = [
  { allow = ["ISC"], crate = "libloading" },
  { allow = ["0BSD"], crate = "smoltcp" },
  { allow = ["0BSD"], crate = "managed" },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
