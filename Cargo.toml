[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/VitalyVorobyev/ecat-flowlab"
authors = ["ECAT FlowLab contributors"]

[workspace.dependencies]
ecat-wire = { path = "crates/ecat-wire" }
flowlab-core = { path = "crates/flowlab-core" }
flowlab-capture = { path = "crates/flowlab-capture" }
flowlab-analysis = { path = "crates/flowlab-analysis" }
flowlab-synth = { path = "crates/flowlab-synth" }
flowlab-sim = { path = "crates/flowlab-sim" }
flowlab-devices = { path = "crates/flowlab-devices" }
flowlab-study = { path = "crates/flowlab-study" }
flowlab-server = { path = "crates/flowlab-server" }
flowlab-live = { path = "crates/flowlab-live" }
flowlab-pdi = { path = "crates/flowlab-pdi" }
flowlab-master = { path = "crates/flowlab-master" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = { version = "1.2", features = ["preserve_order"] }
sha2 = "0.11"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
open = "5"
proptest = "1.11"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
