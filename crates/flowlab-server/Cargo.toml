[package]
name = "flowlab-server"
description = "Local HTTP API and static UI host for ECAT FlowLab."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flowlab-core.workspace = true
flowlab-capture.workspace = true
flowlab-analysis.workspace = true
flowlab-synth.workspace = true
flowlab-sim.workspace = true
flowlab-devices.workspace = true
flowlab-study.workspace = true
flowlab-live.workspace = true
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
ts-rs = "12"
rust-embed = { version = "8.13", features = ["mime-guess", "debug-embed"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true

[features]
# Builds the UI from `ui/dist` into the binary (run `bun run build` in `ui/` first); it is
# served when `--ui-dir` has no built UI.
embed-ui = ["dep:rust-embed"]
