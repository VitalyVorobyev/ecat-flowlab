[package]
name = "flowlab-cli"
description = "ECAT FlowLab command line: analyze, synth, simulate, study, plan, esi, serve, schema."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "flowlab"
path = "src/main.rs"

[dependencies]
flowlab-core.workspace = true
flowlab-capture.workspace = true
flowlab-analysis.workspace = true
flowlab-synth.workspace = true
flowlab-sim.workspace = true
flowlab-devices.workspace = true
flowlab-study.workspace = true
flowlab-server.workspace = true
flowlab-live.workspace = true
flowlab-pdi.workspace = true
flowlab-master = { workspace = true, optional = true }
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
open.workspace = true

[features]
# The built UI (`ui/dist`) inside the binary, served when `--ui-dir` has none: for release
# binaries that run from any directory. Build the UI first (`bun run build` in `ui/`).
embed-ui = ["flowlab-server/embed-ui"]
# `flowlab master`: FlowLab's own EtherCAT master (EtherCrab). It sends frames, so it is opt-in;
# on Windows, linking needs the Npcap SDK.
master = ["dep:flowlab-master", "flowlab-master/hardware"]

[lints]
workspace = true
